name: Build Windows Installer

on:
  release:
    types: [published]
  workflow_dispatch:          # 릴리스 후 Windows 빌드만 다시 돌릴 때 (VERSION 파일의 버전 릴리스에 올린다)

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r windows/requirements.txt
          pip install pyinstaller

      - name: Get version
        id: version
        shell: bash
        run: echo "VERSION=$(cat VERSION)" >> $GITHUB_OUTPUT

      - name: Write cloud-config.json (optional account sync)
        id: cloudcfg
        shell: bash
        env:
          BUNI_CLOUD_CONFIG: ${{ secrets.BUNI_CLOUD_CONFIG }}
        run: |
          if [ -n "$BUNI_CLOUD_CONFIG" ]; then
            printf '%s' "$BUNI_CLOUD_CONFIG" > cloud-config.json
            # PowerShell 에서 ; 는 명령 구분자라 따옴표로 감싸야 한다
            echo 'DATA=--add-data "cloud-config.json;."' >> $GITHUB_OUTPUT
          else
            echo "DATA=" >> $GITHUB_OUTPUT
          fi

      - name: Build Buni-Windows.exe
        run: |
          pyinstaller `
            --onefile `
            --windowed `
            --name Buni-Windows `
            --icon windows/buni_icon.ico `
            --hidden-import pystray `
            --hidden-import PIL `
            --hidden-import PIL.Image `
            --hidden-import PIL.ImageDraw `
            ${{ steps.cloudcfg.outputs.DATA }} `
            windows/buni.py

      - name: Build installer with Inno Setup
        shell: cmd
        run: |
          iscc /DAppVersion=${{ steps.version.outputs.VERSION }} /DExeSource=${{ github.workspace }}\dist\Buni-Windows.exe windows\installer.iss

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          files: |
            windows/Buni-Windows-Setup-${{ steps.version.outputs.VERSION }}.exe
            dist/Buni-Windows.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
